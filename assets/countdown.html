<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<!--
  Countdown screen for an OBS Browser source (same look as standby.html).

  Set the time: right-click the source in OBS -> Interact, then click anywhere
  on the page. Type a duration and press Enter, or click a preset:
    5        -> 5 minutes
    5:00     -> 5 minutes
    1:30:00  -> 1 hour 30 minutes
    @20:30   -> count down to 20:30 (today, or tomorrow if already past)
  Esc closes the panel. The end time is remembered, so reloading the source
  keeps counting; once it has finished, a reload starts your last duration again.

  Optional URL defaults (used only when no countdown is running):
    countdown.html?t=10:00   or   countdown.html?at=20:30
-->
<style>
  /* Same scaling as standby.html: design units scaled by --u, terminal ~40px from
     the edges at 1920x1080, backdrop always fills the screen. */
  :root {
    --u: min(calc(100vw / 1421), calc(100vh / 800));
    --bg: #020402;
    --term: #050a06;
    --border: #22c55e;
    --green: #4ade80;
    --dim: #2f7a43;
    --prompt: #5f8f68;
    --cmd: #e6ffea;
    --err: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    color: var(--green);
  }

  .screen {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, rgba(34, 197, 94, 0.16), rgba(34, 197, 94, 0) 60%), var(--bg);
    cursor: pointer;
  }

  .term {
    position: relative;
    width: calc(1362 * var(--u));
    height: calc(740 * var(--u));
    display: flex; flex-direction: column;
    background: var(--term);
    border: calc(2 * var(--u)) solid var(--border);
    border-radius: calc(6 * var(--u));
    box-shadow: 0 0 calc(60 * var(--u)) rgba(34, 197, 94, 0.12);
  }

  .titlebar {
    height: calc(60 * var(--u));
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 calc(28 * var(--u));
    border-bottom: calc(2 * var(--u)) solid rgba(34, 197, 94, 0.55);
    font-size: calc(26 * var(--u));
  }
  .titlebar .clock { justify-self: end; font-size: calc(22 * var(--u)); color: var(--dim); }

  .content {
    flex: 1;
    display: flex; flex-direction: column;
    padding: calc(30 * var(--u)) calc(38 * var(--u)) calc(34 * var(--u));
    font-size: calc(30 * var(--u));
    line-height: calc(45 * var(--u));
    white-space: pre;
  }
  .prompt { color: var(--prompt); }
  .cmd    { color: var(--cmd); }
  .dim    { color: var(--dim); }
  .b      { font-weight: 700; }

  .hero {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(22 * var(--u));
  }
  .timer {
    font-size: calc(200 * var(--u));
    font-weight: 700;
    line-height: 1;
    letter-spacing: calc(6 * var(--u));
    animation: breathe 4s ease-in-out infinite;
  }
  .timer .t { color: var(--dim); }
  .done .timer { animation: breathe 4s ease-in-out infinite, blink 1.1s step-end infinite; }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 calc(6 * var(--u)) rgba(74, 222, 128, 0.35)); }
    50%      { filter: drop-shadow(0 0 calc(24 * var(--u)) rgba(74, 222, 128, 0.9)); }
  }

  .cells { display: flex; gap: calc(4 * var(--u)); margin: calc(6 * var(--u)) 0 calc(18 * var(--u)); }
  .cells i { width: calc(16 * var(--u)); height: calc(26 * var(--u)); border: calc(2 * var(--u)) solid var(--dim); }
  .cells i.on { background: var(--green); border-color: var(--green); }

  .cursor {
    display: inline-block;
    width: calc(17 * var(--u)); height: calc(32 * var(--u));
    margin-left: calc(12 * var(--u));
    vertical-align: middle;
    background: var(--green);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Config panel: covers the terminal body, opened by a click */
  .config {
    position: absolute;
    left: 0; right: 0; bottom: 0; top: calc(60 * var(--u));
    display: none; flex-direction: column; gap: calc(22 * var(--u));
    padding: calc(30 * var(--u)) calc(38 * var(--u));
    background: rgba(5, 10, 6, 0.97);
    font-size: calc(30 * var(--u));
    line-height: calc(45 * var(--u));
    cursor: default;
  }
  .config.open { display: flex; }
  .config .row { display: flex; align-items: center; flex-wrap: wrap; gap: calc(14 * var(--u)); }
  .config .label { display: inline-block; width: calc(190 * var(--u)); color: var(--prompt); }
  .config .help { font-size: calc(24 * var(--u)); color: var(--dim); padding-left: calc(204 * var(--u)); margin-top: calc(-12 * var(--u)); }
  .config input {
    width: calc(380 * var(--u));
    padding: calc(4 * var(--u)) calc(14 * var(--u));
    font: inherit; font-weight: 700;
    color: var(--cmd); caret-color: var(--green);
    background: transparent;
    border: calc(2 * var(--u)) solid var(--border);
    outline: none;
  }
  .config button {
    padding: calc(2 * var(--u)) calc(14 * var(--u));
    font: inherit;
    color: var(--green);
    background: transparent;
    border: calc(2 * var(--u)) solid var(--dim);
    cursor: pointer;
  }
  .config button:hover, .config button:focus-visible { background: var(--green); border-color: var(--green); color: var(--term); outline: none; }
  .config .err { color: var(--err); }

  .crt {
    position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.35) 0, rgba(0, 0, 0, 0.35) 1px, transparent 1px, transparent 4px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.7) 100%);
  }
</style>
</head>
<body>
  <div class="screen" id="screen">
    <div class="term">
      <div class="titlebar">
        <span>[x]</span>
        <span>rodydacruz@stream: ~</span>
        <span class="clock" id="clock">---------- --:--:--</span>
      </div>

      <div class="content">
        <div><span class="prompt">$ </span><span class="cmd">./start-stream --at <span id="at">--:--</span></span></div>
        <div><span class="b" id="status">[..]</span><span id="statusText"> stream scheduled · countdown running</span></div>

        <div class="hero">
          <div class="timer"><span class="t" id="prefix">T-</span><span id="time">--:--</span></div>
          <div class="dim" id="note"># a live começa já</div>
        </div>

        <div><span class="prompt">$ </span><span class="cmd">wait --until live</span></div>
        <div class="cells" id="cells"></div>
        <div><span class="prompt">$</span><span class="cursor"></span></div>
      </div>

      <div class="config" id="config">
        <div><span class="prompt">$ </span><span class="cmd">countdown --config</span></div>
        <div class="row">
          <span class="label">duração</span>
          <input id="dur" type="text" spellcheck="false" autocomplete="off" aria-label="duração">
        </div>
        <div class="help"># 5 · 5:00 · 1:30:00 · @20:30 = até essa hora</div>
        <div class="row">
          <span class="label">atalhos</span>
          <button data-v="1">[1m]</button>
          <button data-v="3">[3m]</button>
          <button data-v="5">[5m]</button>
          <button data-v="10">[10m]</button>
          <button data-v="15">[15m]</button>
          <button data-v="30">[30m]</button>
        </div>
        <div class="row">
          <span class="label"></span>
          <button id="start">[ iniciar ⏎ ]</button>
          <button id="cancel">[ cancelar esc ]</button>
          <span class="err" id="err"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="crt"></div>

<script>
  (function () {
    var CELLS = 40;
    var KEY_START = 'countdown.start', KEY_END = 'countdown.end', KEY_LAST = 'countdown.last';
    var $ = function (id) { return document.getElementById(id); };
    var pad = function (n) { return String(n).padStart(2, '0'); };
    var store = {
      get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    function fmt(sec) {
      var h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
      return (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
    }
    function hhmm(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

    // "5" | "5m" | "5:00" | "1:30:00" | "@20:30" -> { start, end } or null
    function parse(text) {
      text = String(text || '').trim().toLowerCase();
      var now = Date.now();
      var at = text.match(/^@\s*(\d{1,2})[:h](\d{2})$/);
      if (at) {
        var h = +at[1], m = +at[2];
        if (h > 23 || m > 59) return null;
        var d = new Date(); d.setHours(h, m, 0, 0);
        if (d.getTime() <= now) d.setDate(d.getDate() + 1);
        return { start: now, end: d.getTime() };
      }
      text = text.replace(/\s*(min|m)$/, '');
      var parts = text.split(':');
      if (parts.length > 3 || !parts.every(function (p) { return /^\d+$/.test(p); })) return null;
      var n = parts.map(Number), sec;
      if (n.length === 1) sec = n[0] * 60;
      else if (n.length === 2) sec = n[0] * 60 + n[1];
      else sec = n[0] * 3600 + n[1] * 60 + n[2];
      if (sec <= 0 || sec > 24 * 3600) return null;
      return { start: now, end: now + sec * 1000 };
    }

    // Resume a running countdown, otherwise start from ?at= / ?t= / last used / 5 min.
    var start = +store.get(KEY_START), end = +store.get(KEY_END);
    if (!(end > Date.now() && start > 0)) {
      var q = new URLSearchParams(location.search);
      var first = (q.get('at') && parse('@' + q.get('at'))) || parse(q.get('t')) || parse(store.get(KEY_LAST)) || parse('5');
      start = first.start; end = first.end;
      store.set(KEY_START, start); store.set(KEY_END, end);
    }

    var bar = $('cells');
    for (var i = 0; i < CELLS; i++) bar.appendChild(document.createElement('i'));
    var cells = bar.children;

    function render() {
      var now = Date.now(), d = new Date(now);
      $('clock').textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
        pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

      var left = Math.max(0, end - now), done = left === 0;
      var total = end - start, prog = total > 0 ? Math.min(1, (now - start) / total) : 1;
      document.body.classList.toggle('done', done);
      $('at').textContent = hhmm(end);
      $('prefix').textContent = done ? '' : 'T-';
      $('time').textContent = done ? 'LIVE' : fmt(Math.ceil(left / 1000));
      $('status').textContent = done ? '[ok]' : '[..]';
      $('statusText').textContent = done ? ' stream starting' : ' stream scheduled · countdown running';
      $('note').textContent = done ? '# a começar…' : '# a live começa já';
      var on = Math.round(prog * CELLS);
      for (var j = 0; j < CELLS; j++) cells[j].classList.toggle('on', j < on);
    }

    // Config panel
    var cfg = $('config'), input = $('dur');
    function openCfg() {
      cfg.classList.add('open');
      $('err').textContent = '';
      input.value = store.get(KEY_LAST) || fmt(Math.round((end - start) / 1000));
      input.focus(); input.select();
    }
    function closeCfg() { cfg.classList.remove('open'); }
    function apply(text) {
      var r = parse(text);
      if (!r) { $('err').textContent = '[err] formato inválido'; input.focus(); return; }
      start = r.start; end = r.end;
      store.set(KEY_START, start); store.set(KEY_END, end);
      if (!/^\s*@/.test(text)) store.set(KEY_LAST, String(text).trim());
      closeCfg(); render();
    }

    $('screen').addEventListener('click', function () { if (!cfg.classList.contains('open')) openCfg(); });
    cfg.addEventListener('click', function (e) { e.stopPropagation(); });
    $('start').addEventListener('click', function () { apply(input.value); });
    $('cancel').addEventListener('click', closeCfg);
    cfg.querySelectorAll('button[data-v]').forEach(function (b) {
      b.addEventListener('click', function () { apply(b.getAttribute('data-v')); });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeCfg();
      else if (e.key === 'Enter' && cfg.classList.contains('open')) apply(input.value);
    });

    render();
    setInterval(render, 250);
  })();
</script>
</body>
</html>
