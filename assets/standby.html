<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standby</title>
<style>
  /* Everything is laid out in design units and scaled with --u, so the page fits
     any Browser source size and keeps its proportions. The design area is
     1421x800 units: the 1362x740 terminal plus a slim margin (at 1920x1080 that
     is ~40px on every side). The backdrop always fills the screen. */
  :root {
    --u: min(calc(100vw / 1421), calc(100vh / 800));
    --bg: #020402;
    --term: #050a06;
    --border: #22c55e;
    --green: #4ade80;
    --dim: #2f7a43;
    --prompt: #5f8f68;
    --cmd: #e6ffea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Background lives on <html>: OBS injects CSS that makes <body> transparent. */
  html { background: var(--bg); }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    color: var(--green);
  }

  .screen {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, rgba(34, 197, 94, 0.16), rgba(34, 197, 94, 0) 60%), var(--bg);
  }

  .term {
    width: calc(1362 * var(--u));
    height: calc(740 * var(--u));
    display: flex; flex-direction: column;
    background: var(--term);
    border: calc(2 * var(--u)) solid var(--border);
    border-radius: calc(6 * var(--u));
    box-shadow: 0 0 calc(60 * var(--u)) rgba(34, 197, 94, 0.12);
  }

  .titlebar {
    height: calc(60 * var(--u));
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 calc(28 * var(--u));
    border-bottom: calc(2 * var(--u)) solid rgba(34, 197, 94, 0.55);
    font-size: calc(26 * var(--u));
  }
  .titlebar .clock { justify-self: end; font-size: calc(22 * var(--u)); color: var(--dim); }

  .content {
    flex: 1;
    display: flex; flex-direction: column;
    padding: calc(30 * var(--u)) calc(38 * var(--u)) calc(34 * var(--u));
    font-size: calc(30 * var(--u));
    line-height: calc(45 * var(--u));
    white-space: pre;
  }
  .prompt { color: var(--prompt); }
  .cmd    { color: var(--cmd); }
  .dim    { color: var(--dim); }
  .b      { font-weight: 700; }

  .hero {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(30 * var(--u));
  }
  .hero-row {
    display: flex; align-items: center; gap: calc(60 * var(--u));
    animation: breathe 4s ease-in-out infinite;
  }
  .hero-row svg { width: calc(182 * var(--u)); height: calc(202 * var(--u)); display: block; }
  .hero-text { font-size: calc(132 * var(--u)); font-weight: 700; line-height: 1; letter-spacing: calc(4 * var(--u)); }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 calc(6 * var(--u)) rgba(74, 222, 128, 0.35)); }
    50%      { filter: drop-shadow(0 0 calc(24 * var(--u)) rgba(74, 222, 128, 0.9)); }
  }

  .cells { display: flex; gap: calc(4 * var(--u)); margin: calc(6 * var(--u)) 0 calc(18 * var(--u)); }
  .cells i { width: calc(16 * var(--u)); height: calc(26 * var(--u)); border: calc(2 * var(--u)) solid var(--dim); }
  .cells i.on { background: var(--green); border-color: var(--green); }

  .cursor {
    display: inline-block;
    width: calc(17 * var(--u)); height: calc(32 * var(--u));
    margin-left: calc(12 * var(--u));
    vertical-align: middle;
    background: var(--green);
    animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* CRT scanlines + vignette over everything */
  .crt {
    position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.35) 0, rgba(0, 0, 0, 0.35) 1px, transparent 1px, transparent 4px),
      radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.7) 100%);
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="term">
      <div class="titlebar">
        <span>[x]</span>
        <span>rodydacruz@stream: ~</span>
        <span class="clock" id="clock">---------- --:--:--</span>
      </div>

      <div class="content">
        <div><span class="prompt">$ </span><span class="cmd">obs scene --switch standby</span></div>
        <div><span class="b">[ok]</span> stream paused · away <span class="cmd b" id="away">00:00</span></div>

        <div class="hero">
          <div class="hero-row">
            <!-- IEC 60417-5009 "Stand-by" symbol -->
            <svg viewBox="562 404 182 202" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" aria-hidden="true">
              <path d="M596.4 458.4 A80 80 0 1 0 709.6 458.4"/>
              <path d="M653 415 V505"/>
            </svg>
            <span class="hero-text">STANDBY</span>
          </div>
          <div class="dim"># live volta já</div>
        </div>

        <div><span class="prompt">$ </span><span class="cmd">wait --until live</span></div>
        <div class="cells" id="cells"></div>
        <div><span class="prompt">$</span><span class="cursor"></span></div>
      </div>
    </div>
  </div>
  <div class="crt"></div>

<script>
  (function () {
    var CELLS = 40, STEP_MS = 200;
    var start = Date.now();
    var pad = function (n) { return String(n).padStart(2, '0'); };

    // Progress bar: fills one cell per step, holds full for one step, then restarts.
    var bar = document.getElementById('cells');
    for (var i = 0; i < CELLS; i++) bar.appendChild(document.createElement('i'));
    var cells = bar.children, filled = 0;
    setInterval(function () {
      filled = (filled + 1) % (CELLS + 2);
      for (var j = 0; j < CELLS; j++) cells[j].classList.toggle('on', j < filled);
    }, STEP_MS);

    // Clock in the title bar + time away since the page loaded (OBS reloads it when the scene goes live).
    function tick() {
      var d = new Date();
      document.getElementById('clock').textContent =
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
        pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      var s = Math.floor((Date.now() - start) / 1000);
      document.getElementById('away').textContent =
        (s >= 3600 ? pad(Math.floor(s / 3600)) + ':' : '') + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60);
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
